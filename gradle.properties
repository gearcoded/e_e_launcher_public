# Required because the app uses AndroidX libraries, including Jetpack Compose.
android.useAndroidX=true

# Keeps generated R classes smaller and avoids leaking resources across modules.
android.nonTransitiveRClass=true

# Kotlin style used by Android Studio templates.
kotlin.code.style=official

# Reasonable default memory settings for Gradle on local machines.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
